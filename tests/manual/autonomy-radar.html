<!doctype html><html><head><meta charset="utf-8">
<!-- Self-checking spot-check for the landing-page wheel. Serve the REPO ROOT
     (python3 -m http.server) and open /tests/manual/autonomy-radar.html —
     every line below should read PASS. Add ?headless to drive
     requestAnimationFrame from timers, which is what headless Chrome needs
     (it produces no frames):
       google-chrome --headless=new --virtual-time-budget=60000 \
         --dump-dom 'http://127.0.0.1:8000/tests/manual/autonomy-radar.html?headless' -->
<link rel="stylesheet" href="/styles.css">
<style>body{margin:2rem;max-width:70rem}#log{white-space:pre-wrap;font:12px var(--mono,monospace)}</style>
</head><body>
<!-- a plain div, NOT .demo: kit.js would otherwise mount a second copy on top -->
<div id="host"></div>
<div id="log">booting…</div>
<script type="module" src="/static/demo-kit/kit.js"></script>
<script type="module">
import { angleFor, SYSTEMS, SYSTEM_IDS, readingOf } from '/static/demos/autonomy-radar-data.js';
import { sharesOf } from '/static/demos/volume-math.js';
import { Theme } from '/static/demo-kit/theme.js';

if (location.search.includes('headless')) {
  // headless chrome produces no frames, so rAF never fires: drive it from
  // timers instead, which virtual time does advance.
  window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
  window.cancelAnimationFrame = (id) => clearTimeout(id);
}

const errs = [];
window.addEventListener('error', e => errs.push('ERROR ' + e.message));
window.addEventListener('unhandledrejection', e => errs.push('REJECT ' + e.reason));
const ce = console.error.bind(console); console.error = (...a) => { errs.push('console.error ' + a.join(' ')); ce(...a); };
const out = [];
const flush = () => document.getElementById('log').textContent = out.join('\n');
const ok = (name, cond, extra = '') => { out.push(`${cond ? 'PASS' : 'FAIL'} ${name} ${extra}`); flush(); };
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const $ = (s) => document.querySelector(s);
const codes = () => [...document.querySelectorAll('.radar-code')].map(n => n.textContent);
const shares = () => Object.fromEntries([...document.querySelectorAll('.radar-chip')]
  .map(li => [li.dataset.axis, li.querySelector('.radar-read')?.textContent]));

(async () => { try {
  let mountFn = null;
  const orig = window.Demos.register.bind(window.Demos);
  window.Demos.register = (n, f) => { mountFn = f; orig(n, f); };
  await import('/static/demos/autonomy-radar.js');
  ok('registers under its own name', typeof mountFn === 'function');

  // tour off for a deterministic start
  const cleanup = mountFn(document.getElementById('host'), { autoplay: false }, { Theme });
  ok('returns a cleanup fn', typeof cleanup === 'function');
  await wait(60);
  ok('mounts', !!$('.radar'));
  const canvas = $('.radar canvas');
  ok('canvas sized', canvas.width > 100 && canvas.height > 100, `${canvas.width}x${canvas.height}`);
  ok('opens on the named axes', codes().join(',') === 'TC.1.1,TC.1.2,TC.2.1,TC.2.2,SA.1,SA.2', JSON.stringify(codes()));
  ok('one button per system', document.querySelectorAll('[data-act="system"]').length === SYSTEM_IDS.length);
  ok('names the system on the wheel', $('.radar-now').textContent.includes(SYSTEMS[SYSTEM_IDS[0]].full),
     JSON.stringify($('.radar-now').textContent.slice(0, 60)));

  // geometry, mirroring fit() in the demo
  const r = canvas.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const room = r.width < 560 ? 62 : 132;
  const rho = Math.min(150, Math.max(30, Math.min(r.width / 2 - room, r.height / 2 - 46) / 2.15));
  const LR = rho * 2.15;
  const ev = (type, angle, rad, Ctor = PointerEvent) => canvas.dispatchEvent(new Ctor(type, {
    clientX: r.left + cx + Math.cos(angle) * rad,
    clientY: r.top + cy + Math.sin(angle) * rad, bubbles: true, pointerId: 1 }));

  // the axes are open: hovering far out along a spoke, past its label, still finds it
  ev('pointermove', angleFor(0, 6), LR * 1.2); await wait(30);
  ok('hover explains the split, even beyond the label', !$('.rlmap-tip').hidden &&
     /split into TC\.1\.1\.1 and TC\.1\.1\.2/.test($('.rlmap-tip').textContent),
     JSON.stringify($('.rlmap-tip').textContent.slice(0, 80)));

  ev('click', angleFor(0, 6), LR, MouseEvent);
  await wait(1200);
  ok('clicking an axis splits it', codes().join(',') === 'TC.1.1.1,TC.1.1.2,TC.1.2,TC.2.1,TC.2.2,SA.1,SA.2', JSON.stringify(codes()));
  ok('the children inherit the parent’s share', shares()['tc.1.1.1'] && shares()['tc.1.1.1'] === shares()['tc.1.1.2'],
     JSON.stringify(shares()));

  // fold it back by clicking its lineage arc at the hub (TC.1.1 is depth 3)
  ev('click', (angleFor(0, 7) + angleFor(1, 7)) / 2, 7 + 3 * 6, MouseEvent);
  await wait(1200);
  ok('clicking a hub arc folds that family back',
     codes().join(',') === 'TC.1.1,TC.1.2,TC.2.1,TC.2.2,SA.1,SA.2', JSON.stringify(codes()));

  $('[data-act="reset"]').click(); await wait(1200);
  ok('fold back returns to the two qualities', codes().join(',') === 'TC,SA', JSON.stringify(codes()));

  // ── systems ────────────────────────────────────────────────────────────
  const [first, second] = SYSTEM_IDS;
  $(`[data-act="system"][data-system="${second}"]`).click(); await wait(1600);
  ok('picking a system puts its volume on the wheel', $('.radar-now').textContent.includes(SYSTEMS[second].full)
     && $(`[data-system="${second}"]`).classList.contains('is-on'));
  const want = sharesOf([angleFor(0, 2), angleFor(1, 2)],
    ['tc', 'sa'].map((id) => readingOf(SYSTEMS[second].scores, id)));
  ok('its shares are its readings at the fixed volume',
     shares().tc === `×${want[0].toFixed(1)}` && shares().sa === `×${want[1].toFixed(1)}`,
     JSON.stringify([shares(), want]));

  $(`[data-act="system"][data-system="${first}"]`).click(); await wait(1600);

  // drag the first system's TC handle (straight up) outward
  const up = angleFor(0, 2);
  const tc0 = parseFloat(shares().tc.slice(1)), sa0 = parseFloat(shares().sa.slice(1));
  const tcExact = sharesOf([angleFor(0, 2), angleFor(1, 2)],
    ['tc', 'sa'].map((id) => readingOf(SYSTEMS[first].scores, id)))[0];
  ev('pointermove', up, rho * tcExact); await wait(40);
  ok('hovering a handle names the system, the axis, and the bound',
     new RegExp(`${SYSTEMS[first].label} · Task Complexity`).test($('.rlmap-tip').textContent)
       && /at most ×/.test($('.rlmap-tip').textContent),
     JSON.stringify($('.rlmap-tip').textContent.slice(0, 120)));

  ev('pointerdown', up, rho * tcExact);
  ev('pointermove', up, rho * 1.5);
  ev('pointerup', up, rho * 1.5);
  await wait(60);
  ok('dragging a handle out moves that share there', shares().tc === '×1.5', JSON.stringify(shares()));
  ok('and the other axis pays for it', parseFloat(shares().sa.slice(1)) < sa0, `${sa0} → ${shares().sa}`);
  ok('the drag is announced', /Same volume/.test($('.rlmap-status').textContent),
     JSON.stringify($('.rlmap-status').textContent.slice(0, 80)));
  ok('the drag did not also split the axis', codes().join(',') === 'TC,SA', JSON.stringify(codes()));

  // the volume is fixed: tc and sa shares satisfy the two-spoke area identity
  // ½·π·(13(a²+b²) + 9ab)/35·2 = π  ⇔  13(a²+b²) + 9ab = 35, at an even spread of 1
  try { Object.defineProperty(navigator, 'clipboard', { value: undefined, configurable: true }); } catch {}
  $('[data-act="copy"]').click(); await wait(200);
  const exported = $('.rlmap-export')?.value || '';
  const block = exported.split(`  ${second}: {`)[0];          // the first system's scores
  const parsed = Object.fromEntries([...block.matchAll(/'([a-z.\d]+)':\s+([\d.]+)/g)].map((m) => [m[1], +m[2]]));
  ok('copy readings exports the dragged claim', parsed.tc > 0, JSON.stringify(exported.slice(0, 160)));
  const [a, b] = sharesOf([angleFor(0, 2), angleFor(1, 2)], [readingOf(parsed, 'tc'), readingOf(parsed, 'sa')]);
  ok('and the exported shape is the one dragged, at the same volume',
     Math.abs(a - 1.5) < 0.03 && Math.abs(13 * (a * a + b * b) + 9 * a * b - 35) < 0.05,
     `${a.toFixed(3)}, ${b.toFixed(3)}`);

  $('[data-act="compare"]').click(); await wait(40);
  ok('all at once toggles', $('[data-act="compare"]').classList.contains('is-on'));
  $('[data-act="compare"]').click(); await wait(40);

  // ── the tour ───────────────────────────────────────────────────────────
  $('[data-act="tour"]').click();
  ok('the tour toggles on', /on/.test($('[data-act="tour"]').textContent));
  const seen = new Set();
  for (let i = 0; i < 24; i++) {
    await wait(500);
    const s = SYSTEM_IDS.find((m) => $('.radar-now').textContent.includes(SYSTEMS[m].full));
    if (s) seen.add(s);
  }
  ok('the tour moves the volume from system to system', seen.size >= 3, `saw ${[...seen].join(', ')}`);

  cleanup();
  await wait(100);
  const after = $('.radar-now').textContent;
  await wait(4500);
  ok('cleanup stops the tour', $('.radar-now').textContent === after);

  out.push(errs.length ? 'FAIL console/runtime errors: ' + errs.join(' | ') : 'PASS no console or runtime errors');
  flush();
} catch (e) { out.push('errs: ' + errs.join(' | ')); out.push('THREW ' + (e && e.stack || e)); flush(); }
})();
</script></body></html>
